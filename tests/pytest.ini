[pytest]
# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = .

# Add parent to path for imports
pythonpath = ..

# Markers
markers =
    unit: Unit tests (fast, no I/O, isolated)
    integration: Integration tests (slower, real I/O, pipelines)
    gpu: Needs any accelerator (CUDA or MPS); auto-skipped if the host has none
    cuda: Needs CUDA specifically (e.g. Triton kernels); auto-skipped if absent
    mps: Needs MPS specifically (Metal kernels); auto-skipped if absent
    cuda_only: Deprecated alias for 'cuda'
    slow: Long-running tests (skipped in quick runs)
    openmm: Tests requiring OpenMM (the [amber] extra); skipped if absent
    amber: Tests requiring OpenMM + AmberTools (antechamber/tleap); skipped if absent

# Default options.
#
# Accelerator tests are gated by ``pytest_collection_modifyitems`` in
# conftest.py, which runs whatever the host supports and skips the rest with a
# reason naming the missing backend. Do NOT add a default ``-m`` expression
# here: a mark expression *deselects* at collection time, which no flag can
# undo, so the gating would silently stop working.
addopts =
    -v
    --tb=short
    --strict-markers
    -ra

# Ignore warnings from dependencies
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::FutureWarning

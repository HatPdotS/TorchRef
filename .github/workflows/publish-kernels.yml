name: Publish torchref-kernels

# Builds the prebuilt CPU kernels (kernels/) for every platform TorchRef depends on them
# for, tests each wheel against TorchRef's kernel tests, and publishes on request.
# Publish torchref-kernels BEFORE a torchref release that requires the new version.

on:
  # TEMPORARY, remove before merging: every push to this branch publishes its build to
  # TestPyPI, because workflow_dispatch only works once the workflow is on main.
  push:
    branches: [kernels-package]
  pull_request:
    paths:
      - "kernels/**"
      - ".github/workflows/publish-kernels.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target (none = build and test only)"
        required: true
        default: "none"
        type: choice
        options:
          - none
          - testpypi
          - pypi

jobs:
  wheels:
    name: Wheel (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # manylinux2014 (glibc 2.17): every glibc host that runs a supported torch
          # matches, so pip never falls back to building the sdist there.
          - {name: linux-x86_64, runner: ubuntu-latest, target: x86_64, manylinux: "2014"}
          - {name: linux-aarch64, runner: ubuntu-24.04-arm, target: aarch64, manylinux: "2014"}
          - {name: macos-arm64, runner: macos-15, target: aarch64-apple-darwin, manylinux: ""}
          - {name: windows-x86_64, runner: windows-latest, target: x86_64-pc-windows-msvc, manylinux: ""}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: kernels
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'off' }}
          args: --release --out dist

      - name: Test the wheel against TorchRef's kernel tests
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-index --find-links kernels/dist torchref-kernels
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
          python -c "import torchref_kernels as k; print(k.build_info())"
          python -m pytest -p no:cacheprovider \
            tests/unit/base/test_canonical_sphere_cpu.py \
            tests/unit/frf_separate/test_legendre_kernel.py \
            tests/unit/structure_factor/test_forward.py \
            tests/unit/structure_factor/test_gradients.py

      - uses: actions/upload-artifact@v4
        with:
          name: kernels-wheel-${{ matrix.name }}
          path: kernels/dist/*.whl

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: kernels
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: kernels-sdist
          path: kernels/dist/*.tar.gz

  publish:
    name: Publish to ${{ github.event_name == 'push' && 'testpypi' || inputs.target }}
    needs: [wheels, sdist]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target != 'none')
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ github.event_name == 'push' && 'testpypi' || inputs.target }}
    environment:
      name: ${{ github.event_name == 'push' && 'testpypi' || inputs.target }}-kernels
      url: ${{ (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi') && 'https://pypi.org/p/torchref-kernels' || 'https://test.pypi.org/p/torchref-kernels' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: kernels-*
          path: dist
          merge-multiple: true

      - name: Publish to TestPyPI
        if: env.TARGET == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # A push that did not bump the version re-uploads the same files; skip them.
          skip-existing: true

      - name: Publish to PyPI
        if: env.TARGET == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1

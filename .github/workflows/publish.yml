name: Publish to PyPI

# Publishes torchref-kernels and then torchref. torchref pins a minimum torchref-kernels,
# so the kernels must be on the index first or `pip install torchref` fails on every
# platform with a kernels wheel. A kernels version already on the index is skipped, so a
# release that leaves kernels/ unchanged uploads only torchref; bump kernels/Cargo.toml
# whenever kernels/ changes, or the new kernels are silently not published.
#
# PyPI trusted publishing matches the top-level workflow, so the torchref-kernels project
# on PyPI and TestPyPI needs a trusted publisher for this file (environments
# pypi-kernels / testpypi-kernels), not only for publish-kernels.yml.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target"
        required: true
        default: "testpypi"
        type: choice
        options:
          - testpypi
          - pypi

jobs:
  # No torchref test gate: run the MPS suite (accelerator.yml) and the CUDA suite on the
  # cluster (run_all_tests.sh) before tagging. The kernel wheels are tested as they build.
  kernels:
    name: torchref-kernels
    uses: ./.github/workflows/publish-kernels.yml
    # A called workflow is validated against the caller's grant before any `if:` is
    # evaluated, so its publish job's id-token request fails the whole run unless granted
    # here, even though that job is skipped on this path.
    permissions:
      contents: read
      id-token: write

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip build

      - name: Build package
        run: python -m build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-kernels-testpypi:
    name: Publish torchref-kernels to TestPyPI
    needs: kernels
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi-kernels
      url: https://test.pypi.org/p/torchref-kernels
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: kernels-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-kernels-pypi:
    name: Publish torchref-kernels to PyPI
    needs: kernels
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment:
      name: pypi-kernels
      url: https://pypi.org/p/torchref-kernels
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: kernels-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [build, publish-kernels-testpypi]
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/torchref
    permissions:
      id-token: write

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: [build, publish-kernels-pypi]
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/torchref
    permissions:
      id-token: write

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torchref"
version = "0.7.0"
description = "Pytorch based crystallographic refinement"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "HansPeterSeidel"},
]
# Version requirements validated via tox compatibility testing (2026-01-13)
# Bumped to numpy>=2.0, torch>=2.4 to avoid NumPy 1.x/2.x binary incompatibility
# Tested combinations:
#   - Python 3.11: numpy 2.0-2.3, pandas 2.0-2.3, torch 2.4-2.9, numba 0.59-0.63, scipy 1.10-1.17
#   - Python 3.12: numpy 2.0-2.3, pandas 2.2-2.3, torch 2.4-2.9, numba 0.61-0.63, scipy 1.13-1.17
# Upper bounds set to next minor version above tested maximum
#
# 2026-08-06: upper bounds raised for torch (<2.14), numba (<0.67), pyarrow (<26) and
# tqdm (<4.69) -- the four Dependabot bumps. Validated on Python 3.11 by running the
# full CPU suite against the new resolution (torch 2.13.0 / triton 3.7.1, numba 0.66.0 /
# llvmlite 0.48.0, pyarrow 25.0.0, tqdm 4.68.4, with numpy 2.3.5, pandas 2.3.3,
# scipy 1.17.1, gemmi 0.7.3, reciprocalspaceship 1.0.7) and against the previous
# resolution (torch 2.9.1, numba 0.65.1, pyarrow 22.0.0, tqdm 4.67.3) as a baseline.
# Both runs give an identical 1625 passed / 96 skipped, so the bumps are behaviour-neutral
# on CPU. The CUDA/Triton and MPS kernels were NOT exercised -- the validation host had no
# accelerator, so those paths are covered only by the GPU CI runners.
dependencies = [
    "numpy>=2.0.0,<2.4.0",
    "pandas>=2.0.0,<2.4.0",
    "torch>=2.4.0,<2.14.0",
    "tqdm>=4.61.0,<4.69.0",
    "numba>=0.59.0,<0.67.0",
    "gemmi>=0.5.0,<0.8.0",
    "scipy>=1.10.0,<1.18.0",
    "matplotlib>=3.7.0,<3.11.0",
    "reciprocalspaceship>=0.9.18,<1.1.0",
    "pyarrow>=12.0.0,<26.0.0",
    "ninja>=1.10",
]

[project.scripts]
"torchref.refine" = "torchref.cli.refine:main"
"torchref.difference-refine" = "torchref.cli.collection_difference_refine:main"
"torchref.mtz2map" = "torchref.cli.mtz2map:main"
"torchref.validate-ded" = "torchref.cli.validate_ded:main"
"torchref.phased-difference-map" = "torchref.cli.phased_difference_map:main"
"torchref.add-metadata" = "torchref.cli.add_metadata:main"
"torchref.strip-altlocs" = "torchref.cli.strip_altlocs:main"

[project.optional-dependencies]

dev = [
    "pytest>=6.0.0",
    "pytest-cov>=2.12.0",
    "black>=21.5b2",
    "isort>=5.9.0",
    "flake8>=3.9.0",
]

alignment = [
    "jax>=0.4.0",
    "s2fft>=1.0.0",
    "s2ball>=0.0.2",
    "spherical>=1.0.0",
    "quaternionic>=1.0.0",
]

forcefield = [
    "torchmd-net>=2.0.0",
]

amber = [
    "openmm>=8.0.0",
    "pdbfixer",
]

ihm = [
    "ihm>=1.0",
]

# Optional CCTBX/iotbx functionality (requires conda, not pip)
# Install with: conda install -c conda-forge cctbx-base
# The iotbx module is used in torchref/math_functions/CCTBX_related.py

docs = [
    "sphinx>=4.0.0",
    "sphinx-rtd-theme>=1.0.0",
    "numpydoc>=1.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["torchref*"]

[tool.setuptools.package-data]
torchref = ["data/*.csv", "data/*.json", "data/*.pt", "data/monomer_library/**/*.cif"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
# Used when pytest is invoked from the repo root. ``tests/pytest.ini`` takes
# over when invoked from inside ``tests/``; keep the two in step so behaviour
# does not depend on the working directory. Accelerator tests are gated by
# ``tests/conftest.py``, which runs whatever the host supports -- do not add a
# default ``-m`` expression here, as it deselects at collection time and no
# flag can undo it.
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
pythonpath = ["."]
markers = [
    "unit: Unit tests (fast, no I/O, isolated)",
    "integration: Integration tests (slower, real I/O, pipelines)",
    "gpu: Needs any accelerator (CUDA or MPS); auto-skipped if the host has none",
    "cuda: Needs CUDA specifically (e.g. Triton kernels); auto-skipped if absent",
    "mps: Needs MPS specifically (Metal kernels); auto-skipped if absent",
    "cuda_only: Deprecated alias for 'cuda'",
    "slow: Long-running tests (skipped in quick runs)",
    "openmm: Tests requiring OpenMM (the [amber] extra); skipped if absent",
    "amber: Tests requiring OpenMM + AmberTools (antechamber/tleap); skipped if absent",
]

filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::FutureWarning",
    "error::torchref.utils.backends.TorchRefDegradationWarning",
]

[tool.ruff.lint]
ignore = ["F841","E741","F841","E402","E722"]
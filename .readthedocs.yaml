# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
    # torchref-kernels (kernels/) is built from this checkout, so the docs track it.
    rust: "latest"

sphinx:
  configuration: docs/conf.py

python:
  install:
    - method: pip
      path: kernels
    - method: pip
      path: .
      extra_requirements:
        - docs

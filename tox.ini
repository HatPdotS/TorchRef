    pandas>=2.2.0
    torch>=2.4.0
    numba>=0.61.0
    scipy>=1.13.0

[testenv:py311-numba061]
description = Python 3.11 with numba 0.61 (first NumPy 2.x support)
basepython = python3.11
deps =
    {[testenv]deps}
    numpy>=2.0.0,<2.1.0
    pandas>=2.1.0
    torch>=2.4.0,<2.5.0
    numba>=0.61.0,<0.62.0
    scipy>=1.13.0,<1.14.0

[testenv:py311-minimum]
description = Python 3.11 with minimum viable versions (numpy 2.0 + torch 2.4)
basepython = python3.11
deps =
    {[testenv]deps}
    numpy==2.0.0
    pandas==2.0.0
    torch==2.4.0
    numba==0.61.0
    scipy==1.13.0

